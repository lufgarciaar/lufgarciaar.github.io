<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>{{ site.title }} — Portfolio</title>
<meta name="description" content="{{ site.description | strip_newlines }}">
<meta name="author" content="{{ site.title }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">

<meta property="og:type" content="website">
<meta property="og:title" content="{{ site.title }} — Portfolio">
<meta property="og:description" content="{{ site.description | strip_newlines }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta name="twitter:card" content="summary">

<meta name="theme-color" content="#1B2A4A">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap">

<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
<link rel="icon" href="{{ '/assets/img/favicon.svg' | relative_url }}" type="image/svg+xml">

{%- if site.dark_mode %}
<script>
  /* Applied before first paint so the page never flashes the wrong theme. */
  (function () {
    try {
      var saved = localStorage.getItem('theme');
      if (saved === 'dark' || saved === 'light') {
        document.documentElement.setAttribute('data-theme', saved);
      }
    } catch (e) { /* private mode, blocked storage — fall back to the OS setting */ }
  })();
</script>
{%- endif %}
