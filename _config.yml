# ---------------------------------------------------------------------------
#  Site settings
# ---------------------------------------------------------------------------
title: "Luis Felipe García Arias"
tagline: "Engineer — electronics, signal processing and rehabilitation technology"
description: >-
  Portfolio of Luis Felipe García Arias: engineer and doctoral researcher
  working on electronics, signal processing and movement-based interactive
  systems for rehabilitation.
url: "https://lufgarciaar.github.io"
baseurl: ""
lang: en

# ---------------------------------------------------------------------------
