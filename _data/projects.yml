# ---------------------------------------------------------------------------
#  Projects
# ---------------------------------------------------------------------------
#  Each entry becomes one card in the grid. Fields:
#
#    title       required
#    year        optional, shown next to the title
#    summary     required
#    cover       required, path under assets/img/projects/
#    alt         required, describes the cover image for screen readers
#    tags        optional list, small chips at the bottom of the card
#    gallery     optional list of {src, alt, caption} — opens in the lightbox.
#                Needs at least 2 entries to do anything.
#    links       optional list of {label, url} — DOIs, papers, repos, demos,
#                press coverage... one or as many as apply, each on its own line
#
#  Images: ~1200px wide, 3:2 works best. Anything is accepted; cards crop
#  to a consistent ratio so a mixed set still looks tidy.
# ---------------------------------------------------------------------------

- title: "PhD research: VR neck-stretching game"
  year: "2022 — 2026"
  summary: >-
    A virtual-reality game that turns neck stretching exercises into gameplay,
    built to improve cervical range of motion. Tested with 40 healthy
    participants and then in a feasibility study with four outpatients living
    with cervical dystonia.
  cover: "vr-neck/vr_env.png"
  alt: "Virtual environment of a neck-stretching game"
  tags: ["C#", "Unity", "VR", "Clinical study"]
  gallery:
    - src: "vr-neck/vr_env.png"
      alt: "Virtual environment of a neck-stretching game"
      caption: "In-game view of the neck-stretching exercise."
    - src: "vr-neck/vr_pc.jpg"
      alt: "Setup for game testing"
      caption: "VR headset and gaming PC rendering the game."
  links:
    - label: "EMBC 2025 paper"
      url: "https://doi.org/10.1109/EMBC58623.2025.11253550"
    - label: "UG news article"
      url: "https://www.rug.nl/about-ug/latest-news/news/archief2026/nieuwsberichten/0330-makerswilhelm?lang=en"

- title: "Electronics designed for an EMG hand prosthesis — Cybathlon 2024"
  year: "2024"
  summary: >-
    I developed the electronics to collect the signals from the sensors in the hand and a power circuit board to deliver 12 V to the DC motors from the 7.4 V (nominal) of the batteries. The prosthesis was used by the team of the University of Groningen in the Cybathlon competition of 2024. This edition was organized by ETH Zurich in the Swiss Arena.
  cover: "cybathlon/cybathlon_power_debug.png"
  alt: "Power electronics board for the hand prosthesis, on a lab bench during debugging"
  tags: ["KiCAD", "Circuit design", "Electronics debugging"]
  gallery:
    - src: "cybathlon/cybathlon_power_debug.png"
      alt: "Power electronics board for the hand prosthesis, on a lab bench during debugging"
      caption: "Debug of power electronics for motor steering."
    - src: "cybathlon/cybathlon_sensors_debug.jpg"
      alt: "Socket and hand testing in the laboratory"
      caption: "Debug of EMG recording board in the socket and communication with the board in the hand."

